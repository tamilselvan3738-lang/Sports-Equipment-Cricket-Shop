<!DOCTYPE html>

<head>

    <title>404 - Out of Bounds - AeroVolt Sports</title>
    
    <!-- Google Fonts: Outfit (headings) & Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ----------------------------------------------------
           1. DESIGN SYSTEM & CSS VARIABLES
        ---------------------------------------------------- */
        :root[data-theme="light"] {
            --bg-page: hsl(220, 20%, 94%);
            --bg-card: hsl(0, 0%, 100%);
            --border: hsla(245, 20%, 80%, 0.45);
            --text-primary: hsl(245, 50%, 15%);
            --text-secondary: hsl(245, 20%, 45%);
            --input-bg: hsl(220, 20%, 96%);
            
            --primary: hsl(245, 75%, 52%);
            --primary-glow: rgba(79, 70, 229, 0.15);
            --accent: #f59e0b; /* Sunset Orange / Gold */
            --accent-glow: rgba(245, 158, 11, 0.25);
            --shadow-lg: 0 20px 45px rgba(245, 158, 11, 0.08);
        }

        :root[data-theme="dark"] {
            --bg-page: #0b0f19;
            --bg-card: #111827;
            --border: #1f2937;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --input-bg: #0d1117;
            
            --primary: hsl(245, 90%, 65%);
            --primary-glow: rgba(129, 140, 248, 0.25);
            --accent: #fbbf24;
            --accent-glow: rgba(251, 191, 36, 0.35);
            --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Base Resets */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* ----------------------------------------------------
           2. HEADER ACTION CONTROLS (Top Right)
        ---------------------------------------------------- */
        .header-controls {
            position: absolute;
            top: 2rem;
            inset-inline-end: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
        }

        .action-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: var(--input-bg);
            transform: translateY(-1px);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            position: absolute;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .theme-toggle .sun-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .theme-toggle .moon-icon {
            opacity: 0;
            transform: rotate(-90deg) scale(0);
        }

        :root[data-theme="dark"] .theme-toggle .sun-icon {
            opacity: 0;
            transform: rotate(90deg) scale(0);
        }

        :root[data-theme="dark"] .theme-toggle .moon-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .rtl-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* ----------------------------------------------------
           3. 404 ERROR CARD CONTAINER
        ---------------------------------------------------- */
        .error-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 4rem 3rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        /* Massive 404 Title */
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: -0.5rem;
            animation: text-pulse 2s infinite ease-in-out alternate;
        }

        @keyframes text-pulse {
            0% { filter: drop-shadow(0 2px 4px var(--primary-glow)); }
            100% { filter: drop-shadow(0 4px 15px var(--accent-glow)); }
        }

        .error-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .error-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 380px;
        }

        /* Interactive SVG Animation */
        .svg-container {
            width: 100%;
            max-width: 340px;
            aspect-ratio: 4/2.5;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .out-of-bounds-svg {
            width: 100%;
            height: 100%;
        }

        .boundary-line-pulse {
            animation: line-pulse 1.5s infinite ease-in-out alternate;
        }

        @keyframes line-pulse {
            0% { opacity: 0.4; stroke: var(--primary); }
            100% { opacity: 1; stroke: var(--accent); }
        }

        .bouncing-ball-g {
            animation: ball-bounce 3s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
            transform-origin: 280px 215px;
        }

        @keyframes ball-bounce {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            45% { transform: translate(-100px, -110px) scale(0.9) rotate(-180deg); }
            90% { transform: translate(-200px, -20px) scale(1.05) rotate(-360deg); }
            93% { transform: translate(-200px, 0) scale(1.1, 0.8) rotate(-360deg); }
            96% { transform: translate(-200px, -10px) scale(0.95, 1.05) rotate(-360deg); }
        }

        /* Buttons stack */
        .buttons-stack {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #fbbf24);
            color: #111827;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px var(--accent-glow);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 24px var(--accent-glow);
            transform: translateY(-1.5px);
            filter: brightness(1.05);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
        }

        .btn-secondary {
            background-color: var(--input-bg);
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 12px;
            padding: 0.85rem 1.5rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

<body>

    <!-- Top Right Controls -->
    <div class="header-controls">
        <!-- RTL Swap Toggle -->
        <button class="action-btn rtl-toggle" id="rtl-toggle-btn" aria-label="Toggle Layout Direction LTR to RTL">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 17H4M4 17L8 13M4 17L8 21M4 7H20M20 7L16 3M20 7L16 11"></path>
            </svg>
        </button>

        <!-- Theme Toggle -->
        <button class="action-btn theme-toggle" id="theme-toggle-btn" aria-label="Toggle Dark Mode">
            <svg class="sun-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="M4.93 4.93l1.41 1.41"></path>
                <path d="M17.66 17.66l1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="M6.34 17.66l-1.41 1.41"></path>
                <path d="M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg class="moon-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6.364 6.364 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
        </button>
    </div>

    <!-- Centered 404 Error Card -->
    <div class="error-card">
        <!-- Error Code -->
        <div class="error-code">404</div>

        <!-- Title & description -->
        <div class="error-title">Boundary Exceeded (Out of Bounds)</div>
        <p class="error-desc">
            The page you are looking for has been kicked out of bounds. It may have been relocated or deleted from our sports laboratory registry.
        </p>

        <!-- Animated SVG field and bouncing ball -->
        <div class="svg-container">
            <svg class="out-of-bounds-svg" viewBox="0 0 400 240">
                <defs>
                    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="var(--accent)"></stop>
                        <stop offset="100%" stop-color="var(--primary)"></stop>
                    </linearGradient>
                </defs>

                <!-- Grid Floor Pitch -->
                <path d="M 20 200 L 380 200" stroke="var(--border)" stroke-width="3" stroke-linecap="round"></path>
                <path d="M 200 200 L 200 240" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 2"></path>
                <path d="M 100 200 L 40 240" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 2"></path>
                <path d="M 300 200 L 360 240" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 2"></path>
                
                <!-- White pitch limit line -->
                <line x1="240" y1="130" x2="240" y2="230" stroke="var(--accent)" stroke-width="4" stroke-dasharray="8 4" class="boundary-line-pulse"></line>
                
                <!-- Bounce path line indicator -->
                <path d="M 80 80 Q 150 20 200 120 T 280 215" fill="none" stroke="var(--border)" stroke-dasharray="4 4" stroke-width="2"></path>
                
                <!-- Bouncing sport ball -->
                <g class="bouncing-ball-g">
                    <circle cx="280" cy="215" r="18" fill="url(#ballGrad)" stroke="var(--text-primary)" stroke-width="1.5"></circle>
                    <!-- Ball seam curvature -->
                    <path d="M 266 205 A 15 15 0 0 1 294 225" fill="none" stroke="var(--text-primary)" stroke-width="1.5"></path>
                    <path d="M 266 225 A 15 15 0 0 0 294 205" fill="none" stroke="var(--text-primary)" stroke-width="1.5"></path>
                </g>
            </svg>
        </div>

        <!-- Navigation Buttons -->
        <div class="buttons-stack">
            <a href="index.html" class="btn-primary">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Return to Locker Room</span>
            </a>
            
            <a href="contact.html" class="btn-secondary">
                <span>Report Out-of-Bounds Error</span>
            </a>
        </div>
    </div>

    <!-- ----------------------------------------------------
       4. INTERACTIVITY CONTROLLER (JAVASCRIPT)
    ----------------------------------------------------- -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- Contextual Active Navbar Highlight ---
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            const navLinks = document.querySelectorAll(".nav-menu .nav-link");
            navLinks.forEach(link => {
                const href = link.getAttribute("href");
                link.parentElement.classList.remove("active");
                
                if (href === currentPath) {
                    link.parentElement.classList.add("active");
                } else if ((currentPath === "index.html" || currentPath === "home 2.html" || currentPath === "") && link.textContent.trim().includes("Home")) {
                    link.parentElement.classList.add("active");
                }
            });

            const htmlElement = document.documentElement;

            // --- Theme Controller (Light/Dark Mode) ---
            const themeToggleBtn = document.getElementById("theme-toggle-btn");
            const savedTheme = localStorage.getItem("theme") || "dark";
            htmlElement.setAttribute("data-theme", savedTheme);

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener("click", () => {
                    const currentTheme = htmlElement.getAttribute("data-theme");
                    const nextTheme = currentTheme === "dark" ? "light" : "dark";
                    htmlElement.setAttribute("data-theme", nextTheme);
                    localStorage.setItem("theme", nextTheme);
                });
            }

            // --- Layout Controller (RTL / LTR) ---
            const rtlToggleBtn = document.getElementById("rtl-toggle-btn");
            if (rtlToggleBtn) {
                rtlToggleBtn.addEventListener("click", () => {
                    const currentDir = htmlElement.getAttribute("dir") || "ltr";
                    if (currentDir === "ltr") {
                        htmlElement.setAttribute("dir", "rtl");
                        htmlElement.setAttribute("lang", "ar");
                    } else {
                        htmlElement.setAttribute("dir", "ltr");
                        htmlElement.setAttribute("lang", "en");
                    }
                });
            }
        });
    </script>
</body>
