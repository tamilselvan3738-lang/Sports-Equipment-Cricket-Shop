<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AeroVolt Sports Login - Sign in to access your customized locker, order history, and custom jersey orders.">
    <title>Login - AeroVolt Sports</title>
    
    <!-- Google Fonts: Outfit (headings) & Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ----------------------------------------------------
           1. DESIGN SYSTEM & CSS VARIABLES
        ---------------------------------------------------- */
        :root[data-theme="light"] {
            --bg-page: hsl(220, 20%, 97%);
            --bg-navbar: hsla(220, 20%, 97%, 0.85);
            --bg-card: hsl(0, 0%, 100%);
            --bg-hover: hsl(245, 100%, 97%);
            --bg-dropdown: hsla(0, 0%, 100%, 0.92);
            --input-bg: hsl(220, 20%, 94%);
            
            --text-primary: hsl(245, 50%, 15%);
            --text-secondary: hsl(245, 20%, 35%);
            --text-muted: hsl(240, 10%, 55%);
            
            --primary: hsl(245, 75%, 52%);
            --primary-hover: hsl(245, 75%, 45%);
            --primary-glow: rgba(79, 70, 229, 0.15);
            
            --accent: hsl(14, 100%, 53%); /* Sunset Orange */
            --accent-hover: hsl(14, 100%, 45%);
            --accent-glow: rgba(249, 115, 22, 0.2);
            
            --border: hsla(245, 20%, 80%, 0.35);
            --border-hover: hsla(245, 20%, 70%, 0.5);
            --shadow-sm: 0 2px 8px rgba(79, 70, 229, 0.04);
            --shadow-md: 0 10px 30px rgba(79, 70, 229, 0.06);
            --shadow-lg: 0 20px 40px rgba(79, 70, 229, 0.08);
            
            --glass-blur: 16px;
        }

        :root[data-theme="dark"] {
            --bg-page: hsl(240, 35%, 6%);
            --bg-navbar: hsla(240, 35%, 6%, 0.85);
            --bg-card: hsl(240, 25%, 11%);
            --bg-hover: hsl(245, 30%, 18%);
            --bg-dropdown: hsla(240, 25%, 11%, 0.92);
            --input-bg: hsl(240, 35%, 4%);
            
            --text-primary: hsl(210, 40%, 98%);
            --text-secondary: hsl(240, 15%, 80%);
            --text-muted: hsl(240, 10%, 65%);
            
            --primary: hsl(245, 90%, 65%);
            --primary-hover: hsl(245, 90%, 72%);
            --primary-glow: rgba(129, 140, 248, 0.25);
            
            --accent: hsl(14, 100%, 55%); /* Neon Sunset Orange */
            --accent-hover: hsl(14, 100%, 48%);
            --accent-glow: rgba(249, 115, 22, 0.25);
            
            --border: hsla(245, 20%, 25%, 0.4);
            --border-hover: hsla(245, 20%, 35%, 0.5);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
            
            --glass-blur: 16px;
        }

        /* Base Resets */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* ----------------------------------------------------
           2. HEADER ACTION CONTROLS (Top Right)
        ---------------------------------------------------- */
        .header-controls {
            position: absolute;
            top: 2rem;
            inset-inline-end: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
        }

        .action-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: var(--input-bg);
            transform: translateY(-1px);
        }

        /* Theme Toggle SVG placement */
        .theme-toggle svg {
            width: 20px;
            height: 20px;
            position: absolute;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .theme-toggle .sun-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .theme-toggle .moon-icon {
            opacity: 0;
            transform: rotate(-90deg) scale(0);
        }

        :root[data-theme="dark"] .theme-toggle .sun-icon {
            opacity: 0;
            transform: rotate(90deg) scale(0);
        }

        :root[data-theme="dark"] .theme-toggle .moon-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .rtl-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* ----------------------------------------------------
           3. LOGIN CARD CONTAINER
        ---------------------------------------------------- */
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.25rem 2.25rem;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: center;
        }

        /* Logo Header */
        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            text-decoration: none;
            margin-bottom: 0.25rem;
            transition: transform 0.3s ease;
        }

        .logo-section:hover .logo-badge {
            transform: translateY(-2px) rotate(-3deg) scale(1.05);
            filter: drop-shadow(0 4px 12px var(--primary-glow));
        }

        .logo-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
            animation: bounce-slow 4s infinite ease-in-out;
        }

        .logo-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.1;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .logo-title span.highlight {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes bounce-slow {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-4px) rotate(5deg);
            }
        }

        /* Form elements */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
            text-align: start;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .form-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background-color: var(--bg-card);
        }

        /* Eye Icon Switcher */
        .eye-toggle-btn {
            position: absolute;
            inset-inline-end: 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .eye-toggle-btn:hover {
            opacity: 1;
            color: var(--accent);
        }

        .eye-toggle-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Options Row */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: -0.25rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            user-select: none;
        }

        .checkbox-container input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* Log In Button */
        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            padding: 0.9rem 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .submit-btn:hover {
            box-shadow: 0 8px 24px var(--accent-glow);
            transform: translateY(-1.5px);
            filter: brightness(1.05);
        }

        .submit-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-size: 0.725rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0.5rem 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border);
        }

        /* Social buttons */
        .social-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .social-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .social-btn:hover {
            border-color: var(--accent);
            background-color: var(--bg-card);
            transform: translateY(-1px);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Create Account outline button */
        .create-account-btn {
            background: none;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 12px;
            padding: 0.85rem 1.5rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .create-account-btn:hover {
            background-color: var(--accent-glow);
            box-shadow: 0 4px 15px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* ----------------------------------------------------
           4. RESPONSIVE LAYOUTS
        ---------------------------------------------------- */
        @media (max-width: 480px) {
            body {
                padding: 1.5rem 1rem;
            }

            .login-card {
                padding: 2.25rem 1.5rem;
                gap: 1.5rem;
            }

            .header-controls {
                top: 1rem;
                inset-inline-end: 1rem;
            }
        }
    
        /* ====================================================
           GLOBAL RESPONSIVENESS OVERRIDES
        ==================================================== */
        *, *::before, *::after {
            box-sizing: border-box !important;
        }
        
        html, body {
            max-width: 100% !important;
            overflow-x: hidden !important;
            width: 100% !important;
        }

        img, video, iframe {
            max-width: 100% !important;
            height: auto !important;
        }

        @media (max-width: 1024px) {
            .hero-grid, .telemetry-grid, .materials-grid, .calendar-grid, .radar-grid, .booking-grid, 
            .about-hero-grid, .collage-container, .why-diagonal-grid, .orbit-container, .location-section-grid,
            .custom-hero-grid, .custom-step-grid, .custom-benefits-grid, .bulk-hero-grid, .steps-grid, 
            .benefits-grid, .blog-hero-grid, .blog-featured-grid, .blog-archive-grid, .contact-hero-grid, 
            .contact-form-grid, .brands-hero-grid, .brands-showcase-grid,
            .accessories-grid, .athletes-flex-row, .audit-layout, .calendar-phase-specs, .catalog-grid, 
            .circle-spec-grid, .configurator-card, .flex-grid-wrapper, .grid-container, .material-layout, 
            .quiz-card, .quiz-row, .testimonial-card, .vault-hero-grid, .wizard-row {
                grid-template-columns: 1fr !important;
                gap: 2.5rem !important;
            }
            
            section, .home-section, .about-body, .custom-body, .orders-body, .blog-body, .contact-body, .brands-body {
                padding: 4rem 1.5rem !important;
            }

            /* Responsive Footer overrides (Laptop & Tablet viewports) */
            .footer-container {
                grid-template-columns: 1fr !important;
                gap: 2.5rem !important;
            }
            .brand-col {
                grid-column: span 1 !important;
                text-align: start !important;
                align-items: flex-start !important;
                margin-bottom: 0 !important;
            }
            .brand-col .footer-desc,
            .brand-col .brand-desc {
                margin-inline-start: 0 !important;
                margin-inline-end: auto !important;
                text-align: start !important;
            }
            .brand-col .social-links {
                justify-content: flex-start !important;
            }
            .footer-col {
                text-align: start !important;
            }
            .footer-col ul {
                padding: 0 !important;
            }
            .footer-col ul li {
                justify-content: flex-start !important;
            }
            .footer-bottom-container {
                flex-direction: column !important;
                align-items: flex-start !important;
                text-align: start !important;
                gap: 1rem !important;
            }
            .footer-bottom-links {
                justify-content: flex-start !important;
                flex-wrap: wrap !important;
                gap: 1rem !important;
            }
        }

        /* 768px Breakpoint (Tablets) */
        @media (max-width: 768px) {
            section, .home-section, .about-body, .custom-body, .orders-body, .blog-body, .contact-body, .brands-body {
                padding: 3rem 1.25rem !important;
            }
            
            h1, .hero-title-main {
                font-size: 2.5rem !important;
                line-height: 1.2 !important;
            }
            
            h2, .section-title {
                font-size: 1.85rem !important;
                line-height: 1.25 !important;
            }
            
            h3 {
                font-size: 1.5rem !important;
            }
            
            /* Navbar adjustments */
            .desktop-nav {
                display: none !important;
            }
            
            .mobile-hamburger {
                display: flex !important;
            }

            .logo-title {
                font-size: 1.15rem !important;
            }

            /* Responsive Footer overrides */
            .footer-container {
                grid-template-columns: 1fr !important;
                gap: 2.5rem !important;
            }
            .brand-col {
                grid-column: span 1 !important;
                text-align: start !important;
                align-items: flex-start !important;
                margin-bottom: 0 !important;
            }
            .brand-col .footer-desc,
            .brand-col .brand-desc {
                margin-inline-start: 0 !important;
                margin-inline-end: auto !important;
                text-align: start !important;
            }
            .brand-col .social-links {
                justify-content: flex-start !important;
            }
            .footer-col {
                text-align: start !important;
            }
            .footer-col ul {
                padding: 0 !important;
            }
            .footer-col ul li {
                justify-content: flex-start !important;
            }
            .footer-bottom-container {
                flex-direction: column !important;
                align-items: flex-start !important;
                text-align: start !important;
                gap: 1rem !important;
            }
            .footer-bottom-links {
                justify-content: flex-start !important;
                flex-wrap: wrap !important;
                gap: 1rem !important;
            }
        }

        /* 480px Breakpoint (Mobile Portrait) */
        @media (max-width: 480px) {
            section, .home-section, .about-body, .custom-body, .orders-body, .blog-body, .contact-body, .brands-body {
                padding: 2.5rem 1rem !important;
            }
            
            h1, .hero-title-main {
                font-size: 2rem !important;
            }
            
            h2, .section-title {
                font-size: 1.6rem !important;
            }
            
            .btn-primary, .btn-secondary, .btn-accent, button.btn-primary, button.btn-secondary {
                width: 100% !important;
                text-align: center;
                justify-content: center;
            }
            
            .social-links {
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .logo-tagline {
                display: none !important;
            }

            /* Telemetry & Circular Selector & Orbit Alignments */
            .circular-selector-container, .orbit-visual-box {
                transform: scale(0.85) !important;
                margin: -1.5rem auto !important;
            }
            .telemetry-tabs {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                gap: 0.5rem !important;
                margin-bottom: 1.5rem !important;
            }
            .tab-trigger {
                padding: 0.5rem 0.75rem !important;
                font-size: 0.75rem !important;
                flex: 1 1 calc(33.333% - 0.5rem) !important;
                min-width: 75px !important;
                text-align: center !important;
            }
            .telemetry-readouts {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)) !important;
                gap: 0.75rem !important;
            }
        }

        /* 320px Breakpoint (Small Mobile Screen) */
        @media (max-width: 320px) {
            section, .home-section, .about-body, .custom-body, .orders-body, .blog-body, .contact-body, .brands-body {
                padding: 2rem 0.75rem !important;
            }
            
            h1, .hero-title-main {
                font-size: 1.75rem !important;
            }
            
            h2, .section-title {
                font-size: 1.45rem !important;
            }

            .logo-title {
                font-size: 1rem !important;
            }
            
            /* Force absolute overflow prevention */
            * {
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
            }

            /* Telemetry & Circular Selector & Orbit Alignments */
            .circular-selector-container, .orbit-visual-box {
                transform: scale(0.75) !important;
                margin: -2.5rem auto !important;
            }
            .telemetry-dashboard {
                padding: 0.85rem !important;
            }
            .tab-trigger {
                font-size: 0.7rem !important;
                padding: 0.4rem 0.5rem !important;
            }
        }
    
        /* Hamburger custom SVG toggle button styling */
        .hamburger {
            align-items: center !important;
            justify-content: center !important;
            width: 40px !important;
            height: 40px !important;
            background-color: var(--bg-card) !important;
            border: 1px solid var(--border) !important;
            border-radius: 10px !important;
            cursor: pointer !important;
            padding: 0 !important;
            z-index: 1100 !important;
        }
        .hamburger svg {
            width: 20px !important;
            height: 20px !important;
            color: var(--text-secondary) !important;
            transition: transform 0.3s ease !important;
        }
        .hamburger:hover svg {
            color: var(--primary) !important;
            transform: scale(1.05) !important;
        }
</style>

<body>

    <!-- Top Right Controls -->
    <div class="header-controls">
        <!-- RTL Swap Toggle -->
        <button class="action-btn rtl-toggle" id="rtl-toggle-btn" aria-label="Toggle Layout Direction LTR to RTL">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 17H4M4 17L8 13M4 17L8 21M4 7H20M20 7L16 3M20 7L16 11"></path>
            </svg>
        </button>

        <!-- Theme Toggle -->
        <button class="action-btn theme-toggle" id="theme-toggle-btn" aria-label="Toggle Dark Mode">
            <svg class="sun-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="M4.93 4.93l1.41 1.41"></path>
                <path d="M17.66 17.66l1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="M6.34 17.66l-1.41 1.41"></path>
                <path d="M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg class="moon-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6.364 6.364 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
        </button>
    </div>

    <!-- Centered Login Card -->
    <div class="login-card">
        <!-- Logo -->
        <a href="index.html" class="logo-section" aria-label="AeroVolt Sports Lab Home">
            <div class="logo-badge" aria-hidden="true">
                <svg class="logo-icon-svg" viewBox="0 0 32 32" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block; overflow: visible;">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--primary)"></stop>
                            <stop offset="100%" stop-color="var(--accent)"></stop>
                        </linearGradient>
                    </defs>

        <!-- Form -->
        <form class="login-form" onsubmit="event.preventDefault(); alert('Authentication Simulation Successful!');">
            <!-- Username/Email -->
            <div class="form-group">
                <label for="login-username">Username or Email</label>
                <div class="input-wrapper">
                    <input type="text" id="login-username" class="form-input" placeholder="e.g. secure@example.com" required autocomplete="username">
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    <!-- Toggle eye button -->
                    <button type="button" class="eye-toggle-btn" id="password-eye-btn" aria-label="Show password">
                        <!-- Eye Icon (Default Closed/Open) -->
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Options (Remember + Forgot) -->
            <div class="options-row">
                <label class="checkbox-container">
                    <input type="checkbox" id="remember-me-chk">
                    
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <!-- Log In Submit -->
            <button type="submit" class="submit-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">Or Continue With</div>

        <!-- Social Row -->
        <div class="social-row">

            <button type="button" class="social-btn" aria-label="Sign in with Google">
                <svg viewBox="0 0 24 24" fill="currentColor">

                </svg>
            </button>

            <!-- Facebook -->
            <button type="button" class="social-btn" aria-label="Sign in with Facebook" style="color: #1877f2;">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>

            <!-- Apple -->
            <button type="button" class="social-btn" aria-label="Sign in with Apple">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-.96.04-2.13.64-2.82 1.45-.6.69-1.12 1.82-.98 2.92.1.08 2.15.51 2.81-1.31z"/>

        <!-- Create Account Button -->
        <a href="registeration.html" class="create-account-btn">Create New Account</a>
    </div>

    <!-- ----------------------------------------------------
       5. INTERACTIVITY CONTROLLER (JAVASCRIPT)
    ----------------------------------------------------- -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- Contextual Active Navbar Highlight ---
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            const navLinks = document.querySelectorAll(".nav-menu .nav-link");
            navLinks.forEach(link => {
                const href = link.getAttribute("href");
                link.parentElement.classList.remove("active");
                
                if (href === currentPath) {
                    link.parentElement.classList.add("active");
                } else if ((currentPath === "index.html" || currentPath === "home 2.html" || currentPath === "") && link.textContent.trim().includes("Home")) {
                    link.parentElement.classList.add("active");
                }
            });

            const htmlElement = document.documentElement;

            // --- Theme Controller (Light/Dark Mode) ---
            const themeToggleBtn = document.getElementById("theme-toggle-btn");
            const savedTheme = localStorage.getItem("theme") || "dark"; // Default to dark as in screenshot
            htmlElement.setAttribute("data-theme", savedTheme);

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener("click", () => {
                    const currentTheme = htmlElement.getAttribute("data-theme");
                    const nextTheme = currentTheme === "dark" ? "light" : "dark";
                    htmlElement.setAttribute("data-theme", nextTheme);
                    localStorage.setItem("theme", nextTheme);
                });
            }

            // --- Layout Controller (RTL / LTR) ---
            const rtlToggleBtn = document.getElementById("rtl-toggle-btn");
            if (rtlToggleBtn) {
                rtlToggleBtn.addEventListener("click", () => {
                    const currentDir = htmlElement.getAttribute("dir") || "ltr";
                    if (currentDir === "ltr") {
                        htmlElement.setAttribute("dir", "rtl");
                        htmlElement.setAttribute("lang", "ar");
                    } else {
                        htmlElement.setAttribute("dir", "ltr");
                        htmlElement.setAttribute("lang", "en");
                    }
                });
            }

            // --- Password Show/Hide Toggle ---
            const passwordInput = document.getElementById("login-password");
            const eyeBtn = document.getElementById("password-eye-btn");

            if (eyeBtn && passwordInput) {
                eyeBtn.addEventListener("click", () => {
                    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                    passwordInput.setAttribute("type", type);
                    
                    // Toggle Eye SVG graphic if needed, or simply adjust visibility
                    eyeBtn.innerHTML = type === "password" ? `
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    ` : `
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    `;
                });
            }
        });
    </script>
</body>
